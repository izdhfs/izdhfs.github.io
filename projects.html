<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - DoHyun Kim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 별 배경: 레이어를 가장 뒤로 (-1) */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #000;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.15;
            transition: opacity 0.6s ease;
        }

        .star.bright {
            opacity: 1 !important;
            transform: scale(1.8);
            box-shadow: 0 0 8px #fff;
        }

        /* 헤더: 별보다 위로 (10) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 8%;
            position: relative;
            z-index: 10;
        }

        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
        .main-nav { display: flex; gap: 30px; }
        .nav-item {
            color: #fff; text-decoration: none; font-size: 0.85rem;
            opacity: 0.5; transition: 0.3s; text-transform: uppercase;
        }
        .nav-item:hover, .nav-item.active { opacity: 1; }

        /* 컨텐츠 영역 */
        .content-container { 
            padding: 4rem 15% 4rem; 
            position: relative;
            z-index: 5;
        }
        .intro-section { text-align: center; margin-bottom: 5rem; }
        .title { font-size: 3.5rem; letter-spacing: 4px; margin-bottom: 1rem; }
        .subtitle { font-size: 1.1rem; opacity: 0.6; font-family: 'Arial', sans-serif; }

        /* --- 표(드라이브 컨테이너) 수정 부분 --- */
        .drive-container {
            background-color: #000; /* 완전 검정으로 별을 가림 */
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-bottom: 6rem;
            position: relative;
            z-index: 20; /* 별들보다 훨씬 위로 올림 */
            box-shadow: 0 0 20px rgba(0, 0, 0, 1);
        }

        .drive-header, .drive-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            padding: 15px 30px;
            align-items: center;
            background-color: #000; /* 각 행도 검정 배경 */
        }

        .drive-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .drive-item {
            transition: 0.2s;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .drive-item:hover { background-color: rgba(255, 255, 255, 0.1); }

        .col-name { font-family: 'Arial', sans-serif; font-size: 0.95rem; }
        .col-type, .col-date { font-family: 'Arial', sans-serif; font-size: 0.85rem; opacity: 0.5; }

        /* 모달 팝업창 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background-color: #111;
            margin: 5% auto;
            padding: 40px;
            border: 1px solid #333;
            width: 60%;
            max-width: 800px;
            border-radius: 15px;
            position: relative;
            animation: modalFade 0.4s ease;
            z-index: 1001;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 30px; cursor: pointer; color: #888; }
        .close-btn:hover { color: #fff; }

        .page-footer { text-align: center; position: relative; z-index: 10; }
        .back-btn {
            color: #fff; text-decoration: none; font-size: 0.8rem; opacity: 0.4;
            text-transform: uppercase; letter-spacing: 2px; padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; transition: 0.3s;
        }
        .back-btn:hover { opacity: 1; border-color: #fff; background-color: rgba(255, 255, 255, 0.05); }

        @media (max-width: 768px) {
            .content-container { padding: 4rem 5%; }
            .drive-header { display: none; }
            .drive-item { grid-template-columns: 1fr; gap: 8px; }
            .modal-content { width: 90%; margin: 20% auto; padding: 25px; }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>

    <header>
        <div class="logo" onclick="location.href='index.html'">IZDHFS</div>
        <nav class="main-nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="personal.html" class="nav-item">Personal</a>
            <a href="academic.html" class="nav-item">Academic</a>
            <a href="projects.html" class="nav-item active">Projects</a>
        </nav>
        <div class="header-right" style="width:1.2rem;"></div>
    </header>

    <main class="content-container">
        <section class="intro-section">
            <h1 class="title">PROJECTS</h1>
            <p class="subtitle">Click on a project to see detailed reports.</p>
        </section>

        <section class="drive-container">
            <div class="drive-header">
                <div class="col-name">Name</div>
                <div class="col-type">Type</div>
                <div class="col-date">Date</div>
            </div>
            
            <div class="drive-list">
                <div class="drive-item" onclick="openModal('luminol')">
                    <div class="col-name">루미놀 용액 반응 실험</div>
                    <div class="col-type">Chemistry</div>
                    <div class="col-date">2023. 05</div>
                </div>
                <div class="drive-item" onclick="openModal('spectroscopy')">
                    <div class="col-name">기초 분광학 실험</div>
                    <div class="col-type">Physics</div>
                    <div class="col-date">2023. 08</div>
                </div>
                <div class="drive-item" onclick="openModal('debate')">
                    <div class="col-name">과학토론대회</div>
                    <div class="col-type">Academic</div>
                    <div class="col-date">2023. 11</div>
                </div>
                <div class="drive-item" onclick="openModal('saltfinger')">
                    <div class="col-name">솔트핑거현상 실험</div>
                    <div class="col-type">Earth Science</div>
                    <div class="col-date">2024. 02</div>
                </div>
                <div class="drive-item" onclick="openModal('hormone')">
                    <div class="col-name">호르몬 실험</div>
                    <div class="col-type">Biology</div>
                    <div class="col-date">2024. 04</div>
                </div>
            </div>
        </section>

        <footer class="page-footer">
            <a href="select.html" class="back-btn">Back to Select</a>
        </footer>
    </main>

    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="projectsscript.js"></script>
</body>
</html>
